name: 🐞 Bug report
description: Something isn't working the way it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in enough detail to reproduce the problem.
        **Missing or wrong GPS from a specific camera?** Use the *Camera / GPS compatibility* template instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: I'm on the latest version / `main`
          required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running DashTrack?
      options:
        - Docker (production image)
        - Dev mode (uvicorn + vite)
        - Other (describe above)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - GPS extraction
        - Map / route rendering
        - Video player / sync
        - Library / indexing
        - Multi-segment session
        - Upload flow
        - UI / layout
        - Other / not sure
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or output of `git rev-parse --short HEAD`.
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: e.g. Chrome 126 on Linux
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      description: Server logs and/or browser console errors. Rendered as code — no backticks needed.
      render: shell
    validations:
      required: false
