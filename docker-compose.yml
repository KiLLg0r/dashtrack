services:
  dashtrack:
    container_name: dashtrack
    image: ghcr.io/robert-oblesniuc/dashtrack:latest
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - /dashtrack/footage:/dashtrack/footage:ro   # source MP4 files (read-only)
      - /dashtrack/data:/dashtrack/data        # SQLite database
      - /dashtrack/gpx:/dashtrack/gpx          # cached GPX files
    environment:
      FOOTAGE_DIR: /dashtrack/footage
      DATA_DIR: /dashtrack/data
      GPX_DIR: /dashtrack/gpx
      VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
      # Re-scan the footage dir every N seconds (fallback for NFS/SMB mounts
      # where inotify events don't fire). Set to 0 to disable. Default 300.
      RESCAN_INTERVAL_SEC: 300
      # Set to "true" to force the live watcher into polling mode, needed for
      # near-real-time detection on network filesystems. Default off.
      # WATCH_FORCE_POLLING: "true"
      # Default display units: "metric" (km/h) or "imperial" (mph). Users can
      # still override in the UI; their choice is saved in the browser.
      # UNITS: imperial
